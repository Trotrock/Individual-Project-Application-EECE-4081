name: Django CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      # Fix: Changes directory into project before executing package installations
      run: |
        cd project
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run System Tests
      # Fix: Changes directory into project before initiating the test suite execution pass
      run: |
        cd project
        python manage.py test
